version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: life-organizer-db
    environment:
      POSTGRES_DB: life_organizer
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}  # Usa variable de entorno
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d life_organizer"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  logic-ecom-service:
    #image: edihamilton/logic-ecom-service:latest  # ⚠️ Cambia "tuusuario" por tu usuario de Docker Hub
    container_name: auth-service
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/life_organizer
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: