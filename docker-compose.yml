services:
  logic-ecom-service:
    build: .
    container_name: logic-ecom-service
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # Usamos el nombre del contenedor del Proyecto A
      SPRING_DATASOURCE_URL: jdbc:postgresql://life-organizer-db:5432/life_organizer
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: your_password
    networks:
      - life-shared-network # <--- Se une a la red externa

networks:
  life-shared-network:
    external: true  # <--- IMPORTANTE: Indica que la red ya existe