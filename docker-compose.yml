services:
  logic-ecom-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: logic-ecom-service:latest
    container_name: logic-ecom-service
    ports:
      - "8083:8083"

    # ── Environment ──────────────────────────────────
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8083

      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://life-organizer-db:5432/life_organizer
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-your_password}

      # JWT (override in .env or CI/CD — never commit real secrets)
      JWT_SECRET: ${JWT_SECRET:-ZmFrZS1zdXBlci1sb25nLXNlY3JldC1rZXktdXNlLWEtYmFzZTY0LWtleS1vci1hLWZ1bGwtMjU2Yml0LXN0cmluZw==}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-36000000}

      # CORS (add production domains as needed)
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}

      # JVM tuning for containers
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom"

    # ── Health check ─────────────────────────────────
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

    # ── Resource limits ──────────────────────────────
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.25"

    # ── Logging ──────────────────────────────────────
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - life-shared-network
    restart: unless-stopped

networks:
  life-shared-network:
    external: true