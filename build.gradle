plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.openapi.generator' version '7.16.0'
}

group = 'life-ecom-logic-core'
version = '0.0.1-SNAPSHOT'
description = 'logica para economo'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    runtimeOnly 'org.postgresql:postgresql:42.6.0'
    implementation 'org.liquibase:liquibase-core:4.23.2'
    implementation 'org.hibernate.orm:hibernate-community-dialects:6.6.4.Final'

    // Swagger/OpenAPI (una sola versión)
    implementation 'io.swagger.core.v3:swagger-annotations:2.2.39'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.7'
    implementation 'io.swagger.core.v3:swagger-models:2.2.39'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

//    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

openApiGenerate {
    generatorName = 'spring'
    inputSpec = "$rootDir/src/main/resources/api.yaml"
    outputDir = "$buildDir/generated"
    apiPackage = 'com.backend.organize_life.api'
    modelPackage = 'com.backend.organize_life.model'
    configOptions = [
            dateLibrary: 'java8',
            interfaceOnly: 'false',
            delegatePattern: 'true',
            useSpringBoot3: 'true'
    ]

    globalProperties = [
            apiDocs   : 'false',
            modelDocs : 'false',
            apiTests  : 'false',
            modelTests: 'false'
    ]
}

sourceSets {
    main {
        java {
            srcDirs "$buildDir/generated/src/main/java"
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

compileJava.dependsOn tasks.openApiGenerate

tasks.processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('compileJava') {
    dependsOn tasks.named('openApiGenerate')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

springBoot {
    mainClass = 'com.backend.organize_life.OrganizeLifeApplication'
}