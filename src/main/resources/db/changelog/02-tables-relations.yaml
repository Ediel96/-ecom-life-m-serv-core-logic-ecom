databaseChangeLog:
  - changeSet:
      id: add-relations-indexes-comments
      author: ediel96
      preConditions:
        onFail: CONTINUE
        onError: HALT
          - dbms:
              type: postgresql

      changes:
        # ============= Foreign keys =============
        # accounts.user_id -> users.id
        - preConditions:
            onFail: MARK_RAN
              - tableExists: { tableName: accounts }
              - tableExists: { tableName: users }
              - not:
                  - foreignKeyConstraintExists:
                      foreignKeyName: fk_accounts_user
          changeSetExecuted: false
          changes:
            - addForeignKeyConstraint:
                baseTableName: accounts
                baseColumnNames: user_id
                referencedTableName: users
                referencedColumnNames: id
                onDelete: CASCADE
                constraintName: fk_accounts_user

        # transactions.account_id -> accounts.id
        - preConditions:
            onFail: MARK_RAN
              - tableExists: { tableName: transactions }
              - tableExists: { tableName: accounts }
              - not:
                  - foreignKeyConstraintExists:
                      foreignKeyName: fk_transactions_account
          changes:
            - addForeignKeyConstraint:
                baseTableName: transactions
                baseColumnNames: account_id
                referencedTableName: accounts
                referencedColumnNames: id
                onDelete: CASCADE
                constraintName: fk_transactions_account

        # transactions.user_id -> users.id
        - preConditions:
            onFail: MARK_RAN
              - tableExists: { tableName: transactions }
              - tableExists: { tableName: users }
              - not:
                  - foreignKeyConstraintExists:
                      foreignKeyName: fk_transactions_user
          changes:
            - addForeignKeyConstraint:
                baseTableName: transactions
                baseColumnNames: user_id
                referencedTableName: users
                referencedColumnNames: id
                onDelete: CASCADE
                constraintName: fk_transactions_user

        # transactions.category_id -> categories.id (ON DELETE SET NULL)
        - preConditions:
            onFail: MARK_RAN
              - tableExists: { tableName: transactions }
              - tableExists: { tableName: categories }
              - not:
                  - foreignKeyConstraintExists:
                      foreignKeyName: fk_transactions_category
          changes:
            - addForeignKeyConstraint:
                baseTableName: transactions
                baseColumnNames: category_id
                referencedTableName: categories
                referencedColumnNames: id
                onDelete: SET NULL
                constraintName: fk_transactions_category

        # future_plans.user_id -> users.id
        - preConditions:
            onFail: MARK_RAN
              - tableExists: { tableName: future_plans }
              - tableExists: { tableName: users }
              - not:
                  - foreignKeyConstraintExists:
                      foreignKeyName: fk_future_plans_user
          changes:
            - addForeignKeyConstraint:
                baseTableName: future_plans
                baseColumnNames: user_id
                referencedTableName: users
                referencedColumnNames: id
                onDelete: CASCADE
                constraintName: fk_future_plans_user

        # plan_movements.plan_id -> future_plans.id
        - preConditions:
            onFail: MARK_RAN
              - tableExists: { tableName: plan_movements }
              - tableExists: { tableName: future_plans }
              - not:
                  - foreignKeyConstraintExists:
                      foreignKeyName: fk_plan_movements_plan
          changes:
            - addForeignKeyConstraint:
                baseTableName: plan_movements
                baseColumnNames: plan_id
                referencedTableName: future_plans
                referencedColumnNames: id
                onDelete: CASCADE
                constraintName: fk_plan_movements_plan

        # ============= Indexes (IF NOT EXISTS con preconditions) =============
        - preConditions: { onFail: MARK_RAN, - tableExists: { tableName: transactions }, - not: { - indexExists: { indexName: idx_transactions_date } } }
          changes:
            - createIndex:
                indexName: idx_transactions_date
                tableName: transactions
                columns: [ { column: { name: date } } ]

        - preConditions: { onFail: MARK_RAN, - tableExists: { tableName: transactions }, - not: { - indexExists: { indexName: idx_transactions_type } } }
          changes:
            - createIndex:
                indexName: idx_transactions_type
                tableName: transactions
                columns: [ { column: { name: transaction_type } } ]

        - preConditions: { onFail: MARK_RAN, - tableExists: { tableName: transactions }, - not: { - indexExists: { indexName: idx_transactions_category } } }
          changes:
            - createIndex:
                indexName: idx_transactions_category
                tableName: transactions
                columns: [ { column: { name: category_id } } ]

        - preConditions: { onFail: MARK_RAN, - tableExists: { tableName: transactions }, - not: { - indexExists: { indexName: idx_transactions_account } } }
          changes:
            - createIndex:
                indexName: idx_transactions_account
                tableName: transactions
                columns: [ { column: { name: account_id } } ]

        - preConditions: { onFail: MARK_RAN, - tableExists: { tableName: transactions }, - not: { - indexExists: { indexName: idx_transactions_user } } }
          changes:
            - createIndex:
                indexName: idx_transactions_user
                tableName: transactions
                columns: [ { column: { name: user_id } } ]

        - preConditions: { onFail: MARK_RAN, - tableExists: { tableName: accounts }, - not: { - indexExists: { indexName: idx_accounts_user } } }
          changes:
            - createIndex:
                indexName: idx_accounts_user
                tableName: accounts
                columns: [ { column: { name: user_id } } ]

        - preConditions: { onFail: MARK_RAN, - tableExists: { tableName: future_plans }, - not: { - indexExists: { indexName: idx_future_plans_user } } }
          changes:
            - createIndex:
                indexName: idx_future_plans_user
                tableName: future_plans
                columns: [ { column: { name: user_id } } ]

        - preConditions: { onFail: MARK_RAN, - tableExists: { tableName: plan_movements }, - not: { - indexExists: { indexName: idx_plan_movements_plan } } }
          changes:
            - createIndex:
                indexName: idx_plan_movements_plan
                tableName: plan_movements
                columns: [ { column: { name: plan_id } } ]

        - preConditions: { onFail: MARK_RAN, - tableExists: { tableName: categories }, - not: { - indexExists: { indexName: idx_categories_type } } }
          changes:
            - createIndex:
                indexName: idx_categories_type
                tableName: categories
                columns: [ { column: { name: transaction_type } } ]

        - preConditions: { onFail: MARK_RAN, - tableExists: { tableName: categories }, - not: { - indexExists: { indexName: idx_categories_key } } }
          changes:
            - createIndex:
                indexName: idx_categories_key
                tableName: categories
                columns: [ { column: { name: key } } ]

        # ============= Comments (solo si existen objetos) =============
        - preConditions: { onFail: MARK_RAN, - sqlCheck:
                                                 expectedResult: "1"
                                                 sql: "SELECT 1 FROM pg_type WHERE typname = 'transaction_type' LIMIT 1"
        }
          changes:
            - sql:
                dbms: postgresql
                sql: "COMMENT ON TYPE transaction_type IS 'ENUM for transaction types: income or expense';"

        - preConditions: { onFail: MARK_RAN, - tableExists: { tableName: users } }
          changes:
            - sql: { dbms: postgresql, sql: "COMMENT ON TABLE users IS 'User accounts for the system';" }

        - preConditions: { onFail: MARK_RAN, - tableExists: { tableName: categories } }
          changes:
            - sql: { dbms: postgresql, sql: "COMMENT ON TABLE categories IS 'Enhanced transaction categories with colors and type classification';" }

        - preConditions: { onFail: MARK_RAN, - tableExists: { tableName: accounts } }
          changes:
            - sql: { dbms: postgresql, sql: "COMMENT ON TABLE accounts IS 'Financial accounts (bank, cash, credit cards)';" }

        - preConditions: { onFail: MARK_RAN, - tableExists: { tableName: transactions } }
          changes:
            - sql: { dbms: postgresql, sql: "COMMENT ON TABLE transactions IS 'Enhanced financial transactions with timestamps and better typing';" }

        - preConditions: { onFail: MARK_RAN, - tableExists: { tableName: future_plans } }
          changes:
            - sql: { dbms: postgresql, sql: "COMMENT ON TABLE future_plans IS 'User financial goals and plans';" }

        - preConditions: { onFail: MARK_RAN, - tableExists: { tableName: plan_movements } }
          changes:
            - sql: { dbms: postgresql, sql: "COMMENT ON TABLE plan_movements IS 'Money movements for specific plans';" }

        - preConditions: { onFail: MARK_RAN, - columnExists: { tableName: categories, columnName: key } }
          changes:
            - sql: { dbms: postgresql, sql: "COMMENT ON COLUMN categories.key IS 'Unique identifier for programmatic access';" }

        - preConditions: { onFail: MARK_RAN, - columnExists: { tableName: categories, columnName: color_fill } }
          changes:
            - sql: { dbms: postgresql, sql: "COMMENT ON COLUMN categories.color_fill IS 'Hex color for category visualization';" }

        - preConditions: { onFail: MARK_RAN, - columnExists: { tableName: categories, columnName: color_bg } }
          changes:
            - sql: { dbms: postgresql, sql: "COMMENT ON COLUMN categories.color_bg IS 'CSS class or background color';" }

        - preConditions: { onFail: MARK_RAN, - columnExists: { tableName: transactions, columnName: transaction_type } }
          changes:
            - sql: { dbms: postgresql, sql: "COMMENT ON COLUMN transactions.transaction_type IS 'Type of transaction (redundant with category but useful for queries)';" }