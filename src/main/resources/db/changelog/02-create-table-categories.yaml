databaseChangeLog:
  - changeSet:
      id: v2-create-table-categories
      author: ediel96
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: categories
      changes:
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_categories
              - column:
                  name: key
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: TEXT
                  constraints:
                    nullable: false
              - column: { name: color_fill, type: TEXT }
              - column: { name: color_bg, type: TEXT }
              - column:
                  name: transaction_type
                  type: transaction_type
                  defaultValue: expense
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints: { nullable: false }
        - addUniqueConstraint:
            tableName: categories
            columnNames: key
            constraintName: uq_categories_key