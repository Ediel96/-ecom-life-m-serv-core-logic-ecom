
databaseChangeLog:
  - changeSet:
      id: v5-create-table-future-plans
      author: ediel96
      changes:
        - createTable:
            tableName: future_plans
            columns:
              - column:
                  name: id
                  type: integer
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
              - column:
                  name: estimated_cost
                  type: decimal(12,2)
              - column:
                  name: target_date
                  type: date
              - column:
                  name: priority
                  type: varchar(50)
              - column:
                  name: status
                  type: varchar(50)
              - column:
                  name: done
                  type: boolean
                  defaultValueBoolean: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false