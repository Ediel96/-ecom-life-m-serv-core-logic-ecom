databaseChangeLog:

  # ── Enums ──────────────────────────────────────────────────────────────────
  - changeSet:
      id: v1-create-enums
      author: ediel96
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DO $$ BEGIN
                CREATE TYPE transaction_type AS ENUM ('income', 'expense');
              EXCEPTION WHEN duplicate_object THEN NULL; END $$;

              DO $$ BEGIN
                CREATE TYPE frequency_type AS ENUM (
                  'month', 'week', 'year', 'day', 'weekend', 'none', 'custom',
                  'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday'
                );
              EXCEPTION WHEN duplicate_object THEN NULL; END $$;

              DO $$ BEGIN
                CREATE TYPE notification_type AS ENUM ('payment_reminder', 'recurring_payment', 'system');
              EXCEPTION WHEN duplicate_object THEN NULL; END $$;

              DO $$ BEGIN
                CREATE TYPE plan_movement_type AS ENUM ('DEPOSIT', 'WITHDRAW');
              EXCEPTION WHEN duplicate_object THEN NULL; END $$;
      rollback:
        - sql:
            sql: |
              DROP TYPE IF EXISTS plan_movement_type;
              DROP TYPE IF EXISTS notification_type;
              DROP TYPE IF EXISTS frequency_type;
              DROP TYPE IF EXISTS transaction_type;

  # ── users ──────────────────────────────────────────────────────────────────
  - changeSet:
      id: v1-create-table-users
      author: ediel96
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: users
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints: { primaryKey: true, nullable: false }
              - column: { name: name,          type: VARCHAR(255) }
              - column: { name: email,         type: VARCHAR(255), constraints: { unique: true } }
              - column: { name: password,      type: TEXT }
              - column: { name: username,      type: VARCHAR(255), constraints: { unique: true } }
              - column: { name: last_name,     type: VARCHAR(255) }
              - column: { name: first_name,    type: VARCHAR(255) }
              - column: { name: date_of_birth, type: DATE }
              - column: { name: gender,        type: VARCHAR(50) }
              - column:
                  name: role
                  type: VARCHAR(50)
                  defaultValue: ROLE_USER
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints: { nullable: false }
      rollback:
        - dropTable: { tableName: users }

  # ── categories ─────────────────────────────────────────────────────────────
  - changeSet:
      id: v1-create-table-categories
      author: ediel96
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: categories
      changes:
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints: { primaryKey: true, primaryKeyName: pk_categories }
              - column: { name: key,  type: TEXT, constraints: { nullable: false } }
              - column: { name: name, type: TEXT, constraints: { nullable: false } }
              - column: { name: color_fill, type: TEXT }
              - column: { name: color_bg,   type: TEXT }
              - column:
                  name: transaction_type
                  type: transaction_type
                  defaultValue: expense
                  constraints: { nullable: false }
              - column:
                  name: icon
                  type: TEXT
                  defaultValue: ''
                  constraints: { nullable: false }
              - column:
                  name: type
                  type: TEXT
                  defaultValue: person
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints: { nullable: false }
        - addUniqueConstraint:
            tableName: categories
            columnNames: key
            constraintName: uq_categories_key
      rollback:
        - dropTable: { tableName: categories }

  # ── accounts ───────────────────────────────────────────────────────────────
  - changeSet:
      id: v1-create-table-accounts
      author: ediel96
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: accounts
      changes:
        - createTable:
            tableName: accounts
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_accounts_user
                    references: users(id)
                    deleteCascade: true
              - column: { name: name, type: VARCHAR(255), constraints: { nullable: false } }
              - column:
                  name: account_type
                  type: VARCHAR(50)
                  constraints: { nullable: false }
              - column:
                  name: balance
                  type: "DECIMAL(15,2)"
                  defaultValueNumeric: 0.00
                  constraints: { nullable: false }
              - column:
                  name: currency
                  type: VARCHAR(3)
                  defaultValue: USD
                  constraints: { nullable: false }
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints: { nullable: false }
              - column: { name: type,      type: VARCHAR(50),  defaultValue: bank }
              - column: { name: bank_name, type: VARCHAR(100), defaultValue: Unknown }
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints: { nullable: false }
      rollback:
        - dropTable: { tableName: accounts }

  # ── recurring_transactions ─────────────────────────────────────────────────
  - changeSet:
      id: v1-create-table-recurring-transactions
      author: ediel96
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: recurring_transactions
      changes:
        - createTable:
            tableName: recurring_transactions
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints: { primaryKey: true, primaryKeyName: pk_recurring_transactions }
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_recurring_user
                    references: users(id)
                    deleteCascade: true
              - column:
                  name: account_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_recurring_account
                    references: accounts(id)
              - column:
                  name: category_id
                  type: INT
                  constraints:
                    foreignKeyName: fk_recurring_category
                    references: categories(id)
              - column:
                  name: amount
                  type: "NUMERIC(12,2)"
                  defaultValueNumeric: 0
                  constraints: { nullable: false }
              - column: { name: description, type: TEXT }
              - column:
                  name: transaction_type
                  type: transaction_type
                  defaultValue: expense
                  constraints: { nullable: false }
              - column:
                  name: frequency
                  type: frequency_type
                  constraints: { nullable: false }
              - column:
                  name: interval_count
                  type: INT
                  defaultValueNumeric: 1
                  constraints: { nullable: false }
              - column: { name: start_date,         type: DATE, constraints: { nullable: false } }
              - column: { name: end_date,            type: DATE }
              - column: { name: next_due_date,       type: DATE, constraints: { nullable: false } }
              - column: { name: last_processed_date, type: DATE }
              - column:
                  name: notification_days_before
                  type: INT
                  defaultValueNumeric: 1
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints: { nullable: false }
              - column:
                  name: is_lifestyle
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints: { nullable: false }
      rollback:
        - dropTable: { tableName: recurring_transactions }

  # ── transactions ───────────────────────────────────────────────────────────
  - changeSet:
      id: v1-create-table-transactions
      author: ediel96
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: transactions
      changes:
        - createTable:
            tableName: transactions
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints: { primaryKey: true, primaryKeyName: pk_transactions }
              - column:
                  name: account_id
                  type: INTEGER
                  constraints:
                    foreignKeyName: fk_transactions_account
                    references: accounts(id)
                    deleteCascade: true
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    foreignKeyName: fk_transactions_user
                    references: users(id)
                    deleteCascade: true
              - column:
                  name: category_id
                  type: INTEGER
                  constraints:
                    foreignKeyName: fk_transactions_category
                    references: categories(id)
              - column:
                  name: recurring_transaction_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_transactions_recurring
                    references: recurring_transactions(id)
              - column:
                  name: amount
                  type: "NUMERIC(12,2)"
                  constraints: { nullable: false }
              - column:
                  name: transaction_type
                  type: transaction_type
                  constraints: { nullable: false }
              - column: { name: description,       type: TEXT }
              - column: { name: date,              type: TIMESTAMPTZ, constraints: { nullable: false } }
              - column: { name: notification_date, type: DATE }
              - column:
                  name: notification
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints: { nullable: false }
              - column:
                  name: frequency
                  type: frequency_type
                  defaultValue: none
              - column:
                  name: lifestyle
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints: { nullable: false }
              - column:
                  name: is_recurring
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints: { nullable: false }
              - column:
                  name: estimated_amount
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints: { nullable: false }
      rollback:
        - dropTable: { tableName: transactions }

  # ── future_plans ───────────────────────────────────────────────────────────
  - changeSet:
      id: v1-create-table-future-plans
      author: ediel96
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: future_plans
      changes:
        - createTable:
            tableName: future_plans
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_future_plans_user
                    references: users(id)
                    deleteCascade: true
              - column: { name: title,       type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: description, type: TEXT }
              - column:
                  name: target_amount
                  type: "NUMERIC(12,2)"
                  defaultValueNumeric: 0
                  constraints: { nullable: false }
              - column: { name: target_date,   type: DATE }
              - column: { name: priority,      type: VARCHAR(50) }
              - column:
                  name: status
                  type: VARCHAR(50)
                  defaultValue: ACTIVE
                  constraints: { nullable: false }
              - column: { name: icon,          type: VARCHAR(50) }
              - column: { name: reminder_type, type: VARCHAR(20) }
              - column: { name: reminder_day,  type: INT }
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints: { nullable: false }
      rollback:
        - dropTable: { tableName: future_plans }

  # ── plan_movements ─────────────────────────────────────────────────────────
  - changeSet:
      id: v1-create-table-plan-movements
      author: ediel96
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: plan_movements
      changes:
        - createTable:
            tableName: plan_movements
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints: { primaryKey: true, primaryKeyName: pk_plan_movements }
              - column:
                  name: plan_id
                  type: INT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_plan_movements_plan
                    references: future_plans(id)
                    deleteCascade: true
              - column:
                  name: amount
                  type: "DECIMAL(12,2)"
                  constraints: { nullable: false }
              - column:
                  name: date
                  type: DATE
                  defaultValueComputed: CURRENT_DATE
                  constraints: { nullable: false }
              - column: { name: note, type: TEXT }
              - column:
                  name: movement_type
                  type: plan_movement_type
                  defaultValue: DEPOSIT
                  constraints: { nullable: false }
      rollback:
        - dropTable: { tableName: plan_movements }

  # ── plan_tasks ─────────────────────────────────────────────────────────────
  - changeSet:
      id: v1-create-table-plan-tasks
      author: ediel96
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: plan_tasks
      changes:
        - createTable:
            tableName: plan_tasks
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints: { primaryKey: true, primaryKeyName: pk_plan_tasks }
              - column:
                  name: plan_id
                  type: INT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_plan_tasks_plan
                    references: future_plans(id)
                    deleteCascade: true
              - column: { name: title, type: VARCHAR(255), constraints: { nullable: false } }
              - column:
                  name: value
                  type: "NUMERIC(12,2)"
                  defaultValueNumeric: 0
                  constraints: { nullable: false }
              - column:
                  name: is_completed
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints: { nullable: false }
      rollback:
        - dropTable: { tableName: plan_tasks }

  # ── notifications ──────────────────────────────────────────────────────────
  - changeSet:
      id: v1-create-table-notifications
      author: ediel96
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: notifications
      changes:
        - createTable:
            tableName: notifications
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints: { primaryKey: true, primaryKeyName: pk_notifications }
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_notifications_user
                    references: users(id)
                    deleteCascade: true
              - column:
                  name: recurring_transaction_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_notifications_recurring
                    references: recurring_transactions(id)
                    deleteCascade: true
              - column:
                  name: transaction_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_notifications_transaction
                    references: transactions(id)
                    deleteCascade: true
              - column:
                  name: plan_id
                  type: INT
                  constraints:
                    foreignKeyName: fk_notifications_plan
                    references: future_plans(id)
                    deleteCascade: true
              - column:
                  name: type
                  type: notification_type
                  constraints: { nullable: false }
              - column: { name: title,         type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: message,       type: TEXT,         constraints: { nullable: false } }
              - column: { name: scheduled_for, type: TIMESTAMPTZ,  constraints: { nullable: false } }
              - column: { name: sent_at,       type: TIMESTAMPTZ }
              - column:
                  name: is_read
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints: { nullable: false }
      rollback:
        - dropTable: { tableName: notifications }

  # ── indexes ────────────────────────────────────────────────────────────────
  - changeSet:
      id: v1-add-indexes
      author: ediel96
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              CREATE INDEX IF NOT EXISTS idx_accounts_user_id            ON accounts            (user_id);
              CREATE INDEX IF NOT EXISTS idx_transactions_account_id     ON transactions        (account_id);
              CREATE INDEX IF NOT EXISTS idx_transactions_user_id        ON transactions        (user_id);
              CREATE INDEX IF NOT EXISTS idx_transactions_category_id    ON transactions        (category_id);
              CREATE INDEX IF NOT EXISTS idx_transactions_date           ON transactions        (date);
              CREATE INDEX IF NOT EXISTS idx_transactions_recurring_id   ON transactions        (recurring_transaction_id);
              CREATE INDEX IF NOT EXISTS idx_future_plans_user_id        ON future_plans        (user_id);
              CREATE INDEX IF NOT EXISTS idx_future_plans_status         ON future_plans        (status);
              CREATE INDEX IF NOT EXISTS idx_plan_movements_plan_id      ON plan_movements      (plan_id);
              CREATE INDEX IF NOT EXISTS idx_plan_movements_date         ON plan_movements      (date);
              CREATE INDEX IF NOT EXISTS idx_plan_tasks_plan_id          ON plan_tasks          (plan_id);
              CREATE INDEX IF NOT EXISTS idx_plan_tasks_completed        ON plan_tasks          (is_completed);
              CREATE INDEX IF NOT EXISTS idx_recurring_next_due          ON recurring_transactions (next_due_date) WHERE is_active = true;
              CREATE INDEX IF NOT EXISTS idx_recurring_lifestyle         ON recurring_transactions (is_lifestyle)  WHERE is_active = true;
              CREATE INDEX IF NOT EXISTS idx_notifications_scheduled     ON notifications       (scheduled_for)   WHERE sent_at IS NULL;
              CREATE INDEX IF NOT EXISTS idx_notifications_user_read     ON notifications       (user_id, is_read);

  # ── comments ───────────────────────────────────────────────────────────────
  - changeSet:
      id: v1-add-comments
      author: ediel96
      changes:
        - sql:
            dbms: postgresql
            sql: |
              COMMENT ON TABLE users                  IS 'System users';
              COMMENT ON TABLE categories             IS 'Transaction categories';
              COMMENT ON TABLE accounts               IS 'User financial accounts';
              COMMENT ON TABLE recurring_transactions IS 'Recurring transaction rules';
              COMMENT ON TABLE transactions           IS 'Financial transactions';
              COMMENT ON TABLE future_plans           IS 'Future financial plans (goals)';
              COMMENT ON TABLE plan_movements         IS 'Deposits and withdrawals toward a goal';
              COMMENT ON TABLE plan_tasks             IS 'Checklist items for a goal, each with an optional value';
              COMMENT ON TABLE notifications          IS 'In-app notifications (reminders, recurring payments, goals)';
            splitStatements: false
