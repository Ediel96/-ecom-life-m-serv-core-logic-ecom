databaseChangeLog:

  - changeSet:
      id: seed-categories
      author: ediel96
      changes:
        - sqlFile:
            path: db/seeds/01-categories.sql
            encoding: UTF-8
            relativeToChangelogFile: false

  - changeSet:
      id: seed-users
      author: ediel96
      changes:
        - sqlFile:
            path: db/seeds/02-users.sql
            encoding: UTF-8
            relativeToChangelogFile: false
            splitStatements: true
            endDelimiter: ;

  - changeSet:
      id: seed-accounts
      author: ediel96
      changes:
        - sqlFile:
            path: db/seeds/03-accounts.sql
            encoding: UTF-8
            relativeToChangelogFile: false
