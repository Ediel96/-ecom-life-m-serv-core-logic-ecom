# yaml
databaseChangeLog:
  - changeSet:
      id: v4-2-extend-frequency-type-enum-and-columns
      author: ediel96
      changes:
        - sql:
            sql: |
              DO $$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_type WHERE typname = 'frequency_type') THEN
                  CREATE TYPE frequency_type AS ENUM (
                    'month','week','year','day','weekend','none','custom',
                    'monday','tuesday','wednesday','thursday','friday','saturday','sunday'
                  );
                END IF;
              END $$;
            splitStatements: false
            stripComments: true

        # Add columns to transactions
        - addColumn:
            tableName: transactions
            columns:
              - column:
                  name: notification
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: notification_date
                  type: DATE
                  constraints:
                    nullable: true
              - column:
                  name: frequency
                  type: frequency_type
                  defaultValue: 'none'
                  constraints:
                    nullable: true
              - column:
                  name: lifestyle
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

      rollback:
        - dropColumn:
            tableName: transactions
            columnName: notification
        - dropColumn:
            tableName: transactions
            columnName: notification_date
        - dropColumn:
            tableName: transactions
            columnName: frequency
        - dropColumn:
            tableName: transactions
            columnName: lifestyle

components:
  schemas:
    PlanMovementCreate:
      type: object
      required: [plan_id, amount, date, type]
      properties:
        plan_id: { type: integer }
        amount: { type: number, format: double }
        date: { type: string, format: date }
        note: { type: string }
        type: { $ref: '#/components/schemas/PlanMovementType' }
