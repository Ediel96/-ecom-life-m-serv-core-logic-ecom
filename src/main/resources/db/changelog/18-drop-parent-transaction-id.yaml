databaseChangeLog:
  - changeSet:
      id: v18-drop-parent-transaction-id
      author: ediel96
      changes:
        - sql:
            dbms: postgresql
            sql: |
              ALTER TABLE transactions
                DROP CONSTRAINT IF EXISTS fk_transactions_parent;
              ALTER TABLE transactions
                DROP COLUMN IF EXISTS parent_transaction_id;
            splitStatements: false
      rollback:
        - sql:
            sql: |
              ALTER TABLE transactions
                ADD COLUMN parent_transaction_id BIGINT;
              ALTER TABLE transactions
                ADD CONSTRAINT fk_transactions_parent
                  FOREIGN KEY (parent_transaction_id) REFERENCES transactions(id);
