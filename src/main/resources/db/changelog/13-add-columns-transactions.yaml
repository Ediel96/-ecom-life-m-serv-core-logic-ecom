databaseChangeLog:
  - changeSet:
      id: v13-add-recurring-columns-to-transactions
      author: ediel96
      changes:
        - addColumn:
            tableName: transactions
            columns:
              - column:
                  name: parent_transaction_id
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: fk_transactions_parent
                    references: transactions(id)
              - column:
                  name: is_recurring
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: estimated_amount
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            tableName: transactions
            columnName: parent_transaction_id
        - dropColumn:
            tableName: transactions
            columnName: is_recurring
        - dropColumn:
            tableName: transactions
            columnName: estimated_amount
