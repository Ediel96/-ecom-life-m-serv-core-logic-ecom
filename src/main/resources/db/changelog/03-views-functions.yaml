databaseChangeLog:

  # ── lifestyle_summary view ─────────────────────────────────────────────────
  - changeSet:
      id: v1-create-lifestyle-summary-view
      author: ediel96
      changes:
        - createView:
            viewName: lifestyle_summary
            replaceIfExists: true
            selectQuery: >-
              SELECT
                t.user_id,
                c.name                        AS category_name,
                DATE_TRUNC('month', t.date)   AS month,
                COUNT(*)                      AS transaction_count,
                SUM(t.amount)                 AS total_amount,
                AVG(t.amount)                 AS average_amount
              FROM transactions t
              JOIN categories c ON t.category_id = c.id
              WHERE t.lifestyle = true
                AND t.transaction_type = 'expense'
              GROUP BY t.user_id, c.name, DATE_TRUNC('month', t.date)
      rollback:
        - dropView: { viewName: lifestyle_summary }

  # ── plan_progress view ────────────────────────────────────────────────────
  - changeSet:
      id: v1-create-plan-progress-view
      author: ediel96
      changes:
        - createView:
            viewName: plan_progress
            replaceIfExists: true
            selectQuery: >-
              WITH base AS (
                SELECT
                  p.id,
                  p.user_id,
                  p.title,
                  p.icon,
                  p.target_amount,
                  p.target_date,
                  p.status,
                  p.reminder_type,
                  p.reminder_day,
                  COALESCE(SUM(
                    CASE WHEN m.movement_type = 'DEPOSIT' THEN m.amount ELSE -m.amount END
                  ), 0) AS saved,
                  COALESCE(
                    SUM(CASE WHEN m.movement_type = 'DEPOSIT' THEN m.amount ELSE -m.amount END)
                    / NULLIF(COUNT(DISTINCT DATE_TRUNC('month', m.date)), 0),
                  0) AS avg_monthly_savings
                FROM future_plans p
                LEFT JOIN plan_movements m ON p.id = m.plan_id
                GROUP BY p.id, p.user_id, p.title, p.icon,
                         p.target_amount, p.target_date, p.status,
                         p.reminder_type, p.reminder_day
              )
              SELECT
                *,
                ROUND(saved / NULLIF(target_amount, 0) * 100, 2) AS progress_pct,
                CASE
                  WHEN saved >= target_amount THEN CURRENT_DATE
                  WHEN avg_monthly_savings > 0 THEN
                    (CURRENT_DATE + (((target_amount - saved) / avg_monthly_savings) * 30)::INT)
                  ELSE NULL
                END AS estimated_completion_date
              FROM base
      rollback:
        - dropView: { viewName: plan_progress }

  # ── process_recurring_transactions() function ──────────────────────────────
  - changeSet:
      id: v1-create-process-recurring-function
      author: ediel96
      runOnChange: true
      changes:
        - sql:
            dbms: postgresql
            sql: |
              CREATE OR REPLACE FUNCTION process_recurring_transactions()
              RETURNS void AS $func$
              DECLARE
                  rec               RECORD;
                  new_transaction_id BIGINT;
              BEGIN
                  FOR rec IN
                      SELECT *
                      FROM recurring_transactions
                      WHERE is_active = true
                        AND next_due_date <= CURRENT_DATE
                        AND (end_date IS NULL OR end_date >= CURRENT_DATE)
                  LOOP
                      INSERT INTO transactions (
                          account_id, user_id, category_id, amount,
                          transaction_type, description, date,
                          is_recurring, recurring_transaction_id, lifestyle,
                          notification, notification_date, estimated_amount
                      ) VALUES (
                          rec.account_id, rec.user_id, rec.category_id, rec.amount,
                          rec.transaction_type, rec.description, rec.next_due_date::TIMESTAMPTZ,
                          true, rec.id, rec.is_lifestyle,
                          true, (rec.next_due_date - rec.notification_days_before),
                          false
                      ) RETURNING id INTO new_transaction_id;

                      INSERT INTO notifications (
                          user_id, recurring_transaction_id, transaction_id,
                          type, title, message, scheduled_for
                      ) VALUES (
                          rec.user_id, rec.id, new_transaction_id,
                          'recurring_payment',
                          'Pago recurrente generado',
                          format('Se generó automáticamente el pago de %s por $%s',
                                 rec.description, rec.amount),
                          rec.next_due_date::TIMESTAMPTZ
                      );

                      UPDATE recurring_transactions
                      SET last_processed_date = rec.next_due_date,
                          next_due_date = CASE frequency
                              WHEN 'day'   THEN rec.next_due_date + (interval_count || ' days')::INTERVAL
                              WHEN 'week'  THEN rec.next_due_date + (interval_count || ' weeks')::INTERVAL
                              WHEN 'month' THEN rec.next_due_date + (interval_count || ' months')::INTERVAL
                              WHEN 'year'  THEN rec.next_due_date + (interval_count || ' years')::INTERVAL
                              ELSE rec.next_due_date + INTERVAL '1 month'
                          END,
                          updated_at = NOW()
                      WHERE id = rec.id;
                  END LOOP;
              END;
              $func$ LANGUAGE plpgsql;
            splitStatements: false
      rollback:
        - sql:
            sql: DROP FUNCTION IF EXISTS process_recurring_transactions();
