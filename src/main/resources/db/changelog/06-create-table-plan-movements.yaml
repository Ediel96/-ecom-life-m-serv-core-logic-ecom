databaseChangeLog:
  - changeSet:
      id: v6-create-table-plan-movements
      author: ediel96
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: plan_movements
      changes:
        - createTable:
            tableName: plan_movements
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_plan_movements
              - column:
                  name: plan_id
                  type: INTEGER
                  constraints: { nullable: false }
              - column:
                  name: amount
                  type: DECIMAL(12,2)
                  constraints: { nullable: false }
              - column:
                  name: date
                  type: DATE
                  constraints: { nullable: false }
              - column: { name: note, type: TEXT }
              - column:
                  name: type
                  type: BOOLEAN