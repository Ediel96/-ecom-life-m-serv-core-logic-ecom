databaseChangeLog:
  - changeSet:
      id: v4-create-table-transactions
      author: ediel96
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: transactions
      changes:
        - createTable:
            tableName: transactions
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_transactions
              - column: { name: account_id, type: INTEGER }
              - column: { name: user_id, type: UUID }
              - column: { name: category_id, type: INTEGER }
              - column:
                  name: amount
                  type: NUMERIC(12,2)
                  constraints: { nullable: false }
              - column:
                  name: transaction_type
                  type: transaction_type
                  constraints: { nullable: false }
              - column: { name: description, type: TEXT }
              - column:
                  name: date
                  type: TIMESTAMPTZ
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints: { nullable: false }