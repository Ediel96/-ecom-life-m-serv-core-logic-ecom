
databaseChangeLog:
  - changeSet:
      id: v8-add-indexes
      author: ediel96
      preConditions:
        - onFail: CONTINUE
        - onError: HALT
        - dbms:
            type: postgresql
      changes:
        - createIndex:
            indexName: idx_accounts_user_id
            tableName: accounts
            columns:
              - column:
                  name: user_id

        - createIndex:
            indexName: idx_transactions_account_id
            tableName: transactions
            columns:
              - column:
                  name: account_id

        - createIndex:
            indexName: idx_transactions_user_id
            tableName: transactions
            columns:
              - column:
                  name: user_id

        - createIndex:
            indexName: idx_transactions_category_id
            tableName: transactions
            columns:
              - column:
                  name: category_id

        - createIndex:
            indexName: idx_transactions_date
            tableName: transactions
            columns:
              - column:
                  name: date
                  # Changed from transaction_date to date

        - createIndex:
            indexName: idx_future_plans_user_id
            tableName: future_plans
            columns:
              - column:
                  name: user_id

        - createIndex:
            indexName: idx_plan_movements_plan_id
            tableName: plan_movements
            columns:
              - column:
                  name: plan_id