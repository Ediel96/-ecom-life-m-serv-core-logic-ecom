databaseChangeLog:
  - changeSet:
      id: v12-add-notification-type-enum
      author: ediel96
      changes:
        - sql:
            dbms: postgresql
            sql: |
              DO $$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_type WHERE typname = 'notification_type') THEN
                  CREATE TYPE notification_type AS ENUM ('payment_reminder', 'recurring_payment', 'system');
                END IF;
              END $$;
            splitStatements: false
            stripComments: true
      rollback:
        - sql:
            dbms: postgresql
            sql: DROP TYPE IF EXISTS notification_type;
