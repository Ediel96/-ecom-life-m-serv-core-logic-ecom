
databaseChangeLog:
  - changeSet:
      id: v9-add-comments
      author: ediel96
      preConditions:
        - onFail: CONTINUE
        - onError: HALT
        - dbms:
            type: postgresql
      changes:
        - sql:
            dbms: postgresql
            sql: |
              COMMENT ON TABLE accounts IS 'User financial accounts';
              COMMENT ON TABLE transactions IS 'Financial transactions';
              COMMENT ON TABLE categories IS 'Transaction categories';
              COMMENT ON TABLE future_plans IS 'Future financial plans';
              COMMENT ON TABLE plan_movements IS 'Movements for future plans';
              COMMENT ON TABLE users IS 'System users';