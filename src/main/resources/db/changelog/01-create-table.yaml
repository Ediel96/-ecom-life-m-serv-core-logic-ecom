databaseChangeLog:
  - changeSet:
      id: create-types-and-tables
      author: ediel96
      preConditions:
        onFail: MARK_RAN   # Si ya existen, marca el changeset como ejecutado y sigue
        onError: HALT
          - dbms:
              type: postgresql
          - not:
              - tableExists:
                  tableName: users
          - not:
              - tableExists:
                  tableName: categories
          - not:
              - tableExists:
                  tableName: accounts
          - not:
              - tableExists:
                  tableName: transactions
          - not:
              - tableExists:
                  tableName: future_plans
          - not:
              - tableExists:
                  tableName: plan_movements

      changes:
        # 1) Tipo ENUM en Postgres: crear si no existe
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: false
            sql: |
              DO $$
              BEGIN
                IF NOT EXISTS (SELECT 1 FROM pg_type WHERE typname = 'transaction_type') THEN
                  CREATE TYPE transaction_type AS ENUM ('income','expense');
                END IF;
              END$$;

        # 2) Tabla users
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_users
                    nullable: false
              - column: { name: name, type: VARCHAR(255) }
              - column:
                  name: email
                  type: VARCHAR(255)
              - column: { name: password, type: TEXT }
              - column:
                  name: username
                  type: VARCHAR(255)
              - column: { name: last_name, type: VARCHAR(255) }
              - column: { name: first_name, type: VARCHAR(255) }
              - column: { name: date_of_birth, type: DATE }
              - column: { name: gender, type: VARCHAR(50) }
              - column:
                  name: role
                  type: VARCHAR(50)
                  defaultValue: ROLE_USER
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: NOW()
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: NOW()
        - addUniqueConstraint:
            tableName: users
            columnNames: email
            constraintName: uq_users_email
        - addUniqueConstraint:
            tableName: users
            columnNames: username
            constraintName: uq_users_username

        # 3) Tabla categories
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_categories
              - column:
                  name: key
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: TEXT
                  constraints:
                    nullable: false
              - column: { name: color_fill, type: TEXT }
              - column: { name: color_bg, type: TEXT }
              - column:
                  name: transaction_type
                  type: transaction_type
                  defaultValue: expense
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: categories
            columnNames: key
            constraintName: uq_categories_key

        # 4) Tabla accounts
        - createTable:
            tableName: accounts
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_accounts
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column: { name: name, type: VARCHAR(255) }
              - column: { name: type, type: VARCHAR(255) }
              - column: { name: balance, type: DECIMAL(12,2) }
              - column: { name: currency, type: VARCHAR(10) }

        # 5) Tabla transactions
        - createTable:
            tableName: transactions
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_transactions
              - column: { name: account_id, type: INTEGER }
              - column: { name: user_id, type: UUID }
              - column: { name: category_id, type: INTEGER }
              - column:
                  name: amount
                  type: NUMERIC(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: transaction_type
                  type: transaction_type
                  constraints:
                    nullable: false
              - column: { name: description, type: TEXT }
              - column:
                  name: date
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false

        # 6) Tabla future_plans
        - createTable:
            tableName: future_plans
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_future_plans
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column: { name: description, type: TEXT }
              - column: { name: estimated_cost, type: DECIMAL(12,2) }
              - column: { name: target_date, type: DATE }
              - column: { name: priority, type: VARCHAR(50) }
              - column: { name: status, type: VARCHAR(50) }
              - column:
                  name: done
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false

        # 7) Tabla plan_movements
        - createTable:
            tableName: plan_movements
            columns:
              - column:
                  name: id
                  type: SERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_plan_movements
              - column:
                  name: plan_id
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: DECIMAL(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: date
                  type: DATE
                  constraints:
                    nullable: false
              - column: { name: note, type: TEXT }
              - column: { name: type, type: BOOLEAN }