databaseChangeLog:
  - changeSet:
      id: v4-add-icon-column-to-categories
      author: ediel96
      changes:
        - addColumn:
            tableName: categories
            columns:
              - column:
                  name: icon
                  type: TEXT
                  constraints:
                    nullable: false
                  defaultValue: ''
              - column:
                  name: type
                  type: TEXT
                  defaultValue: 'person'
                  constraints:
                    nullable: false
        - dropDefaultValue:
            tableName: categories
            columnName: icon
            columnDataType: TEXT
