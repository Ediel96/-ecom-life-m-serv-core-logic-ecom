# OpenAPI spec for Ecom & Life Management System
openapi: 3.0.3
info:
  title: Ecom & Life Management System API
  version: 1.0.0
  description: >
    REST API that reflects the database schema. Endpoints include brief descriptions
    to clarify their intention and typical use.

servers:
  - url: /api

tags:
  - name: Users
    description: User accounts for the system.
  - name: Categories
    description: Transaction categories classification.
  - name: Accounts
    description: Financial accounts (bank, cash, credit cards).
  - name: Transactions
    description: Financial transactions for users and accounts.
  - name: Future Plans
    description: User financial goals and plans.
  - name: Plan Movements
    description: Money movements recorded for a plan.
  - name: Plan Tasks
    description: Checklist tasks associated with a future plan.
  - name: Recurring Transactions
    description: Automatic recurring payments and income linked to a base transaction.
  - name: Notifications
    description: In-app notifications for reminders, recurring payments, and system events.
  - name: Lifestyle
    description: Lifestyle-tagged transaction analytics from the lifestyle_summary view.

paths:
  # List users for admin panels or user selectors; create new users.
  /users:
    get:
      tags: [Users]
      summary: List users
      description: Retrieve a paginated list of users.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/sort'
        - in: query
          name: email
          schema: { type: string }
          description: Filter by exact email.
        - in: query
          name: username
          schema: { type: string }
          description: Filter by exact username.
      responses:
        '200':
          description: List of users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageUser'
    post:
      tags: [Users]
      summary: Create user
      description: Register a new user account.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # Operate on a specific user; used to fetch profile, update details, or delete.
  /users/{id}:
    get:
      tags: [Users]
      summary: Get user
      description: Get a user by id.
      parameters:
        - $ref: '#/components/parameters/uuidId'
      responses:
        '200':
          description: User found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Users]
      summary: Update user
      description: Update user fields (server may ignore immutable fields).
      parameters:
        - $ref: '#/components/parameters/uuidId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Users]
      summary: Delete user
      description: Remove a user and cascade where applicable.
      parameters:
        - $ref: '#/components/parameters/uuidId'
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  # Manage categories; used to classify transactions and speed up analytics.
  /categories:
    get:
      tags: [Categories]
      summary: List categories
      description: Retrieve categories, optionally filtered by transaction type.
      parameters:
        - in: query
          name: transaction_type
          schema:
            $ref: '#/components/schemas/TransactionType'
          description: Filter by transaction type.
      responses:
        '200':
          description: List of categories.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
    post:
      tags: [Categories]
      summary: Create category
      description: Add a new category for expenses or income.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryCreate' }
      responses:
        '201':
          description: Category created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /categories/{id}:
    get:
      tags: [Categories]
      summary: Get category
      description: Get a category by id.
      parameters:
        - $ref: '#/components/parameters/intId'
      responses:
        '200':
          description: Category found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Categories]
      summary: Update category
      description: Update a category fields.
      parameters:
        - $ref: '#/components/parameters/intId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryUpdate' }
      responses:
        '200':
          description: Updated category.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Categories]
      summary: Delete category
      description: Remove a category. Transactions may retain it as `NULL` if on delete set null.
      parameters:
        - $ref: '#/components/parameters/intId'
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  # Manage financial accounts; generally tied to a specific user.
  /accounts:
    get:
      tags: [Accounts]
      summary: List accounts
      description: Retrieve accounts, optionally filtered by `user_id`.
      parameters:
        - in: query
          name: user_id
          schema: { type: string, format: uuid }
          description: Filter accounts for a user.
      responses:
        '200':
          description: List of accounts.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Account' }
    post:
      tags: [Accounts]
      summary: Create account
      description: Create a financial account (bank, cash, card).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountCreate' }
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /accounts/{id}:
    get:
      tags: [Accounts]
      summary: Get account
      description: Get an account by id.
      parameters:
        - $ref: '#/components/parameters/intId'
      responses:
        '200':
          description: Account found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Accounts]
      summary: Update account
      description: Update account metadata or balance.
      parameters:
        - $ref: '#/components/parameters/intId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountUpdate' }
      responses:
        '200':
          description: Updated account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Accounts]
      summary: Delete account
      description: Remove an account and its transactions if cascaded.
      parameters:
        - $ref: '#/components/parameters/intId'
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  # Record and query transactions; supports filters for analytics and reporting.
  /transactions:
    get:
      tags: [Transactions]
      summary: List transactions
      description: Retrieve transactions with rich filters for reporting.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/sort'
        # snake_case (actual)
        - in: query
          name: user_id
          schema: { type: string, format: uuid }
          description: Filter by user id.
        - in: query
          name: account_id
          schema: { type: integer }
          description: Filter by account id.
        - in: query
          name: category_id
          schema: { type: integer }
          description: Filter by category id.
        - in: query
          name: transaction_type
          schema:
            $ref: '#/components/schemas/TransactionType'
          description: Filter by income or expense.
        - in: query
          name: date_from
          schema: { type: string, format: date-time }
          description: Inclusive start date-time.
        - in: query
          name: date_to
          schema: { type: string, format: date-time }
          description: Inclusive end date-time.
        # camelCase (cliente moderno)
        - in: query
          name: userId
          schema: { type: string, format: uuid }
          description: Filter by user id (camelCase).
        - in: query
          name: accountId
          schema: { type: integer }
          description: Filter by account id (camelCase).
        - in: query
          name: categoryId
          schema: { type: integer }
          description: Filter by category id (camelCase).
        - in: query
          name: transactionType
          schema:
            $ref: '#/components/schemas/TransactionType'
          description: Filter by income or expense (camelCase).
        - in: query
          name: dateFrom
          schema: { type: string, format: date-time }
          description: Inclusive start date-time (camelCase).
        - in: query
          name: dateTo
          schema: { type: string, format: date-time }
          description: Inclusive end date-time (camelCase).
      responses:
        '200':
          description: List of transactions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageTransaction'
    post:
      tags: [Transactions]
      summary: Create transaction
      description: Record a new transaction for an account or user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionCreate' }
      responses:
        '201':
          description: Transaction created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /transactions/{id}:
    get:
      tags: [Transactions]
      summary: Get transaction
      description: Get a transaction by id.
      parameters:
        - $ref: '#/components/parameters/longId'
      responses:
        '200':
          description: Transaction found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Transactions]
      summary: Update transaction
      description: Update a transaction (e.g., fix amount or category).
      parameters:
        - $ref: '#/components/parameters/longId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionUpdate' }
      responses:
        '200':
          description: Updated transaction.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Transactions]
      summary: Delete transaction
      description: Remove a transaction record.
      parameters:
        - $ref: '#/components/parameters/longId'
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  # Manage financial goals; used to plan saving targets and monitor status.
  /future-plans:
    get:
      tags: [Future Plans]
      summary: List future plans
      description: Retrieve plans, filter by `user_id` and/or `status`.
      parameters:
        - in: query
          name: user_id
          schema: { type: string, format: uuid }
        - in: query
          name: status
          schema: { type: string }
          description: One of PLANNING, SAVING, COMPLETED, CANCELLED.
      responses:
        '200':
          description: List of plans.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FuturePlan' }
    post:
      tags: [Future Plans]
      summary: Create future plan
      description: Define a new financial goal with target date and budget.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FuturePlanCreate' }
      responses:
        '201':
          description: Plan created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FuturePlan' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /future-plans/{id}:
    get:
      tags: [Future Plans]
      summary: Get future plan
      description: Get a plan by id.
      parameters:
        - $ref: '#/components/parameters/intId'
      responses:
        '200':
          description: Plan found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FuturePlan' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Future Plans]
      summary: Update future plan
      description: Update title, dates, amounts, or status.
      parameters:
        - $ref: '#/components/parameters/intId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FuturePlanUpdate' }
      responses:
        '200':
          description: Updated plan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FuturePlan' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Future Plans]
      summary: Delete future plan
      description: Remove a plan and its movements if cascaded.
      parameters:
        - $ref: '#/components/parameters/intId'
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  # Record savings/withdrawals against a plan; used to track progress.
  /plan-movements:
    get:
      tags: [Plan Movements]
      summary: List plan movements
      description: Retrieve movements, optionally filtered by `plan_id`.
      parameters:
        - in: query
          name: plan_id
          schema: { type: integer }
          description: Filter by plan id.
      responses:
        '200':
          description: List of plan movements.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PlanMovement' }
    post:
      tags: [Plan Movements]
      summary: Create plan movement
      description: Add a deposit or withdrawal for a plan.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanMovementCreate' }
      responses:
        '201':
          description: Movement created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanMovement' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /plan-movements/{id}:
    get:
      tags: [Plan Movements]
      summary: Get plan movement
      description: Get a plan movement by id.
      parameters:
        - $ref: '#/components/parameters/intId'
      responses:
        '200':
          description: Movement found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanMovement' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Plan Movements]
      summary: Update plan movement
      description: Update amount, date, note, or type.
      parameters:
        - $ref: '#/components/parameters/intId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanMovementUpdate' }
      responses:
        '200':
          description: Updated movement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanMovement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Plan Movements]
      summary: Delete plan movement
      description: Remove a plan movement.
      parameters:
        - $ref: '#/components/parameters/intId'
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  # -----------------------------------------------------------------------
  # Plan Tasks
  # -----------------------------------------------------------------------

  /plan-tasks:
    get:
      tags: [Plan Tasks]
      summary: List plan tasks
      description: Retrieve tasks, optionally filtered by `plan_id`.
      parameters:
        - in: query
          name: plan_id
          schema: { type: integer }
          description: Filter by plan id.
      responses:
        '200':
          description: List of plan tasks.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PlanTask' }
    post:
      tags: [Plan Tasks]
      summary: Create plan task
      description: Add a task (checklist item) to a plan.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanTaskCreate' }
      responses:
        '201':
          description: Task created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanTask' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /plan-tasks/{id}:
    get:
      tags: [Plan Tasks]
      summary: Get plan task
      parameters:
        - $ref: '#/components/parameters/intId'
      responses:
        '200':
          description: Task found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanTask' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Plan Tasks]
      summary: Update plan task
      parameters:
        - $ref: '#/components/parameters/intId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanTaskUpdate' }
      responses:
        '200':
          description: Updated task.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanTask' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Plan Tasks]
      summary: Delete plan task
      parameters:
        - $ref: '#/components/parameters/intId'
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  # -----------------------------------------------------------------------
  # Recurring Transactions
  # -----------------------------------------------------------------------

  # Create a recurring rule linked to a base transaction; list all rules for a user.
  /recurring-transactions:
    get:
      tags: [Recurring Transactions]
      summary: List recurring transactions
      description: >
        Returns all recurring rules for a user. Use `is_active` and `is_lifestyle`
        to narrow results. Rules drive the `process_recurring_transactions()` function.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/sort'
        - in: query
          name: user_id
          schema: { type: string, format: uuid }
          description: Filter by user id.
        - in: query
          name: is_active
          schema: { type: boolean }
          description: Filter active / inactive rules.
        - in: query
          name: is_lifestyle
          schema: { type: boolean }
          description: Filter lifestyle-tagged rules.
        - in: query
          name: frequency
          schema: { $ref: '#/components/schemas/FrequencyType' }
          description: Filter by recurrence frequency.
      responses:
        '200':
          description: Paginated list of recurring rules.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageRecurringTransaction' }
    post:
      tags: [Recurring Transactions]
      summary: Create recurring transaction
      description: >
        Register a new recurring rule. The `transaction_id` must point to an
        existing transaction that serves as the template for future copies.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecurringTransactionCreate' }
      responses:
        '201':
          description: Recurring rule created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecurringTransaction' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /recurring-transactions/{id}:
    get:
      tags: [Recurring Transactions]
      summary: Get recurring transaction
      description: Retrieve a single recurring rule by id.
      parameters:
        - $ref: '#/components/parameters/longId'
      responses:
        '200':
          description: Recurring rule found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecurringTransaction' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Recurring Transactions]
      summary: Update recurring transaction
      description: >
        Update dates, frequency, interval, or lifestyle flag.
        Updating `next_due_date` reschedules the next automatic execution.
      parameters:
        - $ref: '#/components/parameters/longId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecurringTransactionUpdate' }
      responses:
        '200':
          description: Updated recurring rule.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecurringTransaction' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Recurring Transactions]
      summary: Delete recurring transaction
      description: >
        Permanently removes the recurring rule. Notifications and previously
        generated transactions are removed via cascade.
      parameters:
        - $ref: '#/components/parameters/longId'
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  # Toggle a rule on/off without deleting it.
  /recurring-transactions/{id}/toggle:
    patch:
      tags: [Recurring Transactions]
      summary: Toggle active status
      description: >
        Flips `is_active` between true and false. Inactive rules are skipped
        by `process_recurring_transactions()` without being deleted.
      parameters:
        - $ref: '#/components/parameters/longId'
      responses:
        '200':
          description: Rule with updated `is_active` flag.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecurringTransaction' }
        '404': { $ref: '#/components/responses/NotFound' }

  # -----------------------------------------------------------------------
  # Notifications
  # -----------------------------------------------------------------------

  # Query inbox notifications for a user; used to populate the notification bell.
  /notifications:
    get:
      tags: [Notifications]
      summary: List notifications
      description: >
        Returns notifications for a user, ordered by `scheduled_for` desc by default.
        Supports filtering by read status and type.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/sort'
        - in: query
          name: user_id
          required: true
          schema: { type: string, format: uuid }
          description: User whose notifications to retrieve.
        - in: query
          name: is_read
          schema: { type: boolean }
          description: Filter by read / unread status.
        - in: query
          name: type
          schema: { $ref: '#/components/schemas/NotificationType' }
          description: Filter by notification type.
        - in: query
          name: scheduled_before
          schema: { type: string, format: date-time }
          description: Return only notifications scheduled before this datetime.
      responses:
        '200':
          description: Paginated list of notifications.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageNotification' }

  # Mark all unread notifications as read for a user in one call.
  /notifications/read-all:
    patch:
      tags: [Notifications]
      summary: Mark all as read
      description: Sets `is_read = true` for every unread notification belonging to `user_id`.
      parameters:
        - in: query
          name: user_id
          required: true
          schema: { type: string, format: uuid }
          description: User whose notifications will be marked read.
      responses:
        '200':
          description: Number of notifications updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer, description: Count of notifications marked as read. }

  /notifications/{id}:
    get:
      tags: [Notifications]
      summary: Get notification
      description: Retrieve a single notification by id.
      parameters:
        - $ref: '#/components/parameters/longId'
      responses:
        '200':
          description: Notification found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Notifications]
      summary: Delete notification
      description: Remove a notification from the inbox.
      parameters:
        - $ref: '#/components/parameters/longId'
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  # Mark a single notification as read without fetching the full list.
  /notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Mark notification as read
      description: Sets `is_read = true` and records `sent_at` timestamp if not already set.
      parameters:
        - $ref: '#/components/parameters/longId'
      responses:
        '200':
          description: Updated notification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '404': { $ref: '#/components/responses/NotFound' }

  # -----------------------------------------------------------------------
  # Lifestyle Analytics
  # -----------------------------------------------------------------------

  # Aggregated view of lifestyle expenses grouped by category and month.
  /lifestyle/summary:
    get:
      tags: [Lifestyle]
      summary: Lifestyle summary
      description: >
        Returns data from the `lifestyle_summary` view: total and average
        lifestyle expenses per category per month. Useful for charts and
        spending habit analysis.
      parameters:
        - in: query
          name: user_id
          required: true
          schema: { type: string, format: uuid }
          description: User whose lifestyle data to aggregate.
        - in: query
          name: month_from
          schema: { type: string, format: date, example: '2025-01-01' }
          description: Inclusive start month (truncated to month).
        - in: query
          name: month_to
          schema: { type: string, format: date, example: '2025-12-01' }
          description: Inclusive end month (truncated to month).
      responses:
        '200':
          description: Aggregated lifestyle summary rows.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LifestyleSummary' }

  # Raw lifestyle-tagged transactions with pagination; used for detail drill-down.
  /lifestyle/transactions:
    get:
      tags: [Lifestyle]
      summary: List lifestyle transactions
      description: >
        Returns paginated transactions where `lifestyle = true`.
        Equivalent to `GET /transactions` filtered by lifestyle flag.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/sort'
        - in: query
          name: user_id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: category_id
          schema: { type: integer }
        - in: query
          name: date_from
          schema: { type: string, format: date-time }
        - in: query
          name: date_to
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Paginated lifestyle transactions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageTransaction' }

components:
  parameters:
    uuidId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
      description: UUID identifier.
    intId:
      in: path
      name: id
      required: true
      schema: { type: integer }
      description: Integer identifier.
    longId:
      in: path
      name: id
      required: true
      schema: { type: integer, format: int64 }
      description: Long identifier.
    page:
      in: query
      name: page
      schema: { type: integer, minimum: 0, default: 0 }
      description: Page number (0-based).
    size:
      in: query
      name: size
      schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
      description: Page size.
    sort:
      in: query
      name: sort
      schema: { type: string }
      description: Sort criteria, e.g. "date,desc".

  responses:
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Validation or request error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    TransactionType:
      type: string
      enum: [income, expense]

    FrequencyType:
      type: string
      enum: [month,week,year,day,weekend,none,custom,
             monday,tuesday,wednesday,thursday,friday,saturday,sunday]

    FuturePlanStatus:
      type: string
      enum: [ ACTIVE, COMPLETED, PAUSED ]

    User:
      type: object
      description: User entity without sensitive fields.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        username: { type: string }
        last_name: { type: string }
        first_name: { type: string }
        date_of_birth: { type: string, format: date }
        gender: { type: string }
        role: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UserCreate:
      type: object
      required: [id, email, username, password]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password }
        username: { type: string }
        last_name: { type: string }
        first_name: { type: string }
        date_of_birth: { type: string, format: date }
        gender: { type: string }
        role: { type: string, default: ROLE_USER }
    UserUpdate:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        username: { type: string }
        last_name: { type: string }
        first_name: { type: string }
        date_of_birth: { type: string, format: date }
        gender: { type: string }
        role: { type: string }

    Category:
      type: object
      properties:
        id: { type: integer }
        key: { type: string, description: Programmatic unique key. }
        name: { type: string }
        icon: { type: string }
        color_fill: { type: string }
        color_bg: { type: string }
        transaction_type: { $ref: '#/components/schemas/TransactionType' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CategoryCreate:
      type: object
      required: [key, name]
      properties:
        key: { type: string }
        name: { type: string }
        icon: { type: string }
        color_fill: { type: string }
        color_bg: { type: string }
        transaction_type: { $ref: '#/components/schemas/TransactionType' }
    CategoryUpdate:
      allOf:
        - $ref: '#/components/schemas/CategoryCreate'

    Account:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string }
        isActivated: { type: boolean, default: true }
        balance: { type: number, format: double, default: 0.0 }
        currency: { type: string, example: USD }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        account_type: { type: string, default: 'bank' }
        bank_name: { type: string }
    AccountCreate:
      type: object
      required: [name, type, currency]
      properties:
        user_id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string }
        isActivated: { type: boolean, default: true }
        balance: { type: number, format: double, default: 0.0 }
        currency: { type: string, example: USD }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        account_type : { type: string, default: 'bank' }
        bank_name : { type: string }
    AccountUpdate:
      allOf:
        - $ref: '#/components/schemas/AccountCreate'

    Transaction:
      type: object
      properties:
        id: { type: integer, format: int64 }
        account_id: { type: integer, nullable: true }
        user_id: { type: string, format: uuid, nullable: true }
        category_id: { type: integer, nullable: true }
        recurring_transaction_id: { type: integer, format: int64, nullable: true, description: "ID of the recurring rule that generated this transaction." }
        amount: { type: number, format: double }
        transaction_type: { $ref: '#/components/schemas/TransactionType' }
        description: { type: string }
        date: { type: string, format: date-time }
        frequency: { $ref: '#/components/schemas/FrequencyType' }
        notification: { type: boolean, default: false }
        notification_date: { type: string, format: date }
        lifestyle: { type: boolean, default: false }
        is_recurring: { type: boolean, default: false, description: "True when this transaction was generated by a recurring rule." }
        estimated_amount: { type: boolean, default: false, description: "True when the amount is an estimate, not confirmed." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TransactionCreate:
      type: object
      required: [amount, transaction_type, date]
      properties:
        account_id: { type: integer, nullable: true }
        user_id: { type: string, format: uuid, nullable: true }
        category_id: { type: integer, nullable: true }
        recurring_transaction_id: { type: integer, format: int64, nullable: true }
        amount: { type: number, format: double }
        transaction_type: { $ref: '#/components/schemas/TransactionType' }
        description: { type: string }
        date: { type: string, format: date-time }
        frequency: { $ref: '#/components/schemas/FrequencyType' }
        notification: { type: boolean, default: false }
        notification_date: { type: string, format: date }
        lifestyle: { type: boolean, default: false }
        is_recurring: { type: boolean, default: false }
        estimated_amount: { type: boolean, default: false }
    TransactionUpdate:
      allOf:
        - $ref: '#/components/schemas/TransactionCreate'

    FuturePlan:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        target_amount: { type: number, format: double, default: 0 }
        target_date: { type: string, format: date }
        priority:
          $ref: '#/components/schemas/Priority'
        status:
          $ref: '#/components/schemas/FuturePlanStatus'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    FuturePlanCreate:
      type: object
      required: [user_id, title]
      properties:
        user_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        target_amount: { type: number, format: double }
        target_date: { type: string, format: date }
        priority: { type: string }
        status: { type: string }
    FuturePlanUpdate:
      allOf:
        - $ref: '#/components/schemas/FuturePlanCreate'

    Priority:
      type: string
      enum: [ HIGH, MEDIUM, LOW ]

    PlanMovementType:
      type: string
      enum: [ DEPOSIT, WITHDRAWAL ]

    PlanMovement:
      type: object
      properties:
        id: { type: integer }
        plan_id: { type: integer }
        amount: { type: number, format: double }
        date: { type: string, format: date }
        note: { type: string }
        movement_type:
          $ref: '#/components/schemas/PlanMovementType'

    PlanMovementCreate:
      type: object
      required: [plan_id, amount, date, movement_type]
      properties:
        plan_id: { type: integer }
        amount: { type: number, format: double }
        date: { type: string, format: date }
        note: { type: string }
        movement_type: { $ref: '#/components/schemas/PlanMovementType' }
    PlanMovementUpdate:
      allOf:
        - $ref: '#/components/schemas/PlanMovementCreate'

    PlanTask:
      type: object
      properties:
        id: { type: integer }
        plan_id: { type: integer }
        title: { type: string }
        is_completed: { type: boolean, default: false }
        created_at: { type: string, format: date-time }

    PlanTaskCreate:
      type: object
      required: [plan_id, title]
      properties:
        plan_id: { type: integer }
        title: { type: string }
        is_completed: { type: boolean, default: false }

    PlanTaskUpdate:
      type: object
      properties:
        title: { type: string }
        is_completed: { type: boolean }

    NotificationType:
      type: string
      enum: [payment_reminder, recurring_payment, system]
      description: >
        payment_reminder – manual reminder set on a transaction;
        recurring_payment – auto-generated by process_recurring_transactions();
        system – platform-level alert.

    RecurringTransaction:
      type: object
      description: >
        A rule that auto-generates transactions on a schedule.
        Stores its own template data (amount, category, account) so that
        each generated transaction is self-contained. Generated transactions
        reference back via transactions.recurring_transaction_id.
      properties:
        id: { type: integer, format: int64 }
        user_id: { type: string, format: uuid }
        account_id: { type: integer, format: int64, nullable: true }
        category_id: { type: integer, nullable: true }
        amount: { type: number, format: double }
        description: { type: string }
        transaction_type: { $ref: '#/components/schemas/TransactionType' }
        frequency: { $ref: '#/components/schemas/FrequencyType' }
        interval_count: { type: integer, default: 1, description: "Number of frequency units between executions (e.g. 2 + month = every 2 months)." }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, nullable: true, description: "Null means the rule runs indefinitely." }
        next_due_date: { type: string, format: date, description: "Date of the next scheduled transaction generation." }
        last_processed_date: { type: string, format: date, nullable: true }
        notification_days_before: { type: integer, default: 1, description: "Days before next_due_date to fire a payment_reminder notification." }
        is_active: { type: boolean, default: true }
        is_lifestyle: { type: boolean, default: false, description: "When true, generated transactions inherit lifestyle = true." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RecurringTransactionCreate:
      type: object
      required: [user_id, amount, transaction_type, frequency, start_date, next_due_date]
      properties:
        user_id: { type: string, format: uuid }
        account_id: { type: integer, format: int64, nullable: true }
        category_id: { type: integer, nullable: true }
        amount: { type: number, format: double }
        description: { type: string }
        transaction_type: { $ref: '#/components/schemas/TransactionType' }
        frequency: { $ref: '#/components/schemas/FrequencyType' }
        interval_count: { type: integer, default: 1, minimum: 1 }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, nullable: true }
        next_due_date: { type: string, format: date }
        notification_days_before: { type: integer, default: 1, minimum: 0 }
        is_active: { type: boolean, default: true }
        is_lifestyle: { type: boolean, default: false }

    RecurringTransactionUpdate:
      type: object
      description: All fields optional; only provided fields are updated.
      properties:
        account_id: { type: integer, format: int64, nullable: true }
        category_id: { type: integer, nullable: true }
        amount: { type: number, format: double }
        description: { type: string }
        transaction_type: { $ref: '#/components/schemas/TransactionType' }
        frequency: { $ref: '#/components/schemas/FrequencyType' }
        interval_count: { type: integer, minimum: 1 }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, nullable: true }
        next_due_date: { type: string, format: date }
        notification_days_before: { type: integer, minimum: 0 }
        is_active: { type: boolean }
        is_lifestyle: { type: boolean }

    Notification:
      type: object
      description: In-app notification for a user event.
      properties:
        id: { type: integer, format: int64 }
        user_id: { type: string, format: uuid }
        recurring_transaction_id: { type: integer, format: int64, nullable: true, description: "Set when generated by a recurring rule." }
        transaction_id: { type: integer, format: int64, nullable: true, description: "Related transaction, if any." }
        type: { $ref: '#/components/schemas/NotificationType' }
        title: { type: string }
        message: { type: string }
        scheduled_for: { type: string, format: date-time, description: "When the notification should be surfaced to the user." }
        sent_at: { type: string, format: date-time, nullable: true, description: "Null until the notification is delivered." }
        is_read: { type: boolean, default: false }
        created_at: { type: string, format: date-time }

    LifestyleSummary:
      type: object
      description: Aggregated row from the lifestyle_summary view.
      properties:
        user_id: { type: string, format: uuid }
        category_name: { type: string }
        month: { type: string, format: date-time, description: "Month truncated to first day (DATE_TRUNC result)." }
        transaction_count: { type: integer, format: int64 }
        total_amount: { type: number, format: double }
        average_amount: { type: number, format: double }

    PageRecurringTransaction:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/RecurringTransaction' }
        page: { type: integer }
        size: { type: integer }
        total_elements: { type: integer, format: int64 }
        total_pages: { type: integer }

    PageNotification:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        page: { type: integer }
        size: { type: integer }
        total_elements: { type: integer, format: int64 }
        total_pages: { type: integer }

    PageUser:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/User' }
        page: { type: integer }
        size: { type: integer }
        total_elements: { type: integer, format: int64 }
        total_pages: { type: integer }
    PageTransaction:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Transaction' }
        page: { type: integer }
        size: { type: integer }
        total_elements: { type: integer, format: int64 }
        total_pages: { type: integer }

    Error:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string }
        message: { type: string }
        path: { type: string }
