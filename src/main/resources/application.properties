# Application
spring.application.name=eddie

# -----------------------
# Datasource (override with env vars in production)
# -----------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/life_organizer}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:your_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# -----------------------`
# JPA / Hibernate
# -----------------------
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.type.preferred_jdbc_type_for_enum=NAMED_ENUM


# -----------------------
# JWT / Security
# -----------------------
jwt.secret=ZmFrZS1zdXBlci1sb25nLXNlY3JldC1rZXktdXNlLWEtYmFzZTY0LWtleS1vci1hLWZ1bGwtMjU2Yml0LXN0cmluZw==
jwt.expiration-ms=36000000

# -----------------------
# Profiles / AOP
# -----------------------
spring.profiles.active=dev
#spring.aop.proxy-target-class=true

# -----------------------
# Database migrations
# -----------------------
spring.liquibase.change-log=classpath:db/master.yaml

# -----------------------
# CORS
# -----------------------
cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS

# -----------------------
# Jackson
# -----------------------
spring.jackson.mapper.accept-case-insensitive-enums=true

# -----------------------
# Logging (use INFO in prod)
# -----------------------
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=DEBUG
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG

# -----------------------
# Error responses (dev-friendly)
# -----------------------
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-exception=true
server.error.include-stacktrace=always

# -----------------------
# Static resources / 404 handling
# -----------------------
spring.web.resources.add-mappings=false

# Notes:
# - Replace defaults by setting DB_URL, DB_USER, DB_PASSWORD, JWT_SECRET in the environment or CI/CD.
# - For production, move secrets to a vault or secret manager and set logging to INFO/WARN.